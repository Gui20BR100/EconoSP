<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#2563eb" stroke-opacity="0.35" stroke-width="8"/>

  <!-- Traçado Rodoviário em Perspectiva -->
  <polygon points="120,440 236,230 276,230 392,440" fill="url(#roadGrad)" stroke="#334155" stroke-width="4"/>
  
  <!-- Linha Central da Rodovia (Tracejada Amarela) -->
  <line x1="256" y1="240" x2="256" y2="430" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 18"/>

  <!-- Trilhas Laterais Neon (Azul e Verde de Economia) -->
  <line x1="124" y1="438" x2="238" y2="232" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="388" y1="438" x2="274" y2="232" stroke="#10b981" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ponto de Conexão Superior / Sol Urbano -->
  <circle cx="256" cy="228" r="28" fill="#3b82f6" filter="url(#glow)" opacity="0.6"/>

  <!-- Escudo Distintivo EconoSP Superior -->
  <g transform="translate(176, 70)">
    <path d="M 80 0 L 150 24 L 150 96 C 150 144 80 180 80 180 C 80 180 10 144 10 96 L 10 24 Z" fill="url(#accentGrad)" stroke="#60a5fa" stroke-width="6"/>
    <!-- Texto SP Centralizado no Escudo -->
    <text x="80" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="2">SP</text>
  </g>

  <!-- Pílula Inferior de Identificação "ECONO" -->
  <g transform="translate(156, 436)">
    <rect width="200" height="42" rx="21" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
    <text x="100" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#34d399" text-anchor="middle" letter-spacing="4">ECONOSP</text>
  </g>
</svg>
